name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Perbaikan: Menghapus opsi 'cache: npm' agar tidak mencari package-lock.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || true

      - name: Direct Vite Build
        run: |
          npx vite build --base=./ || npm run build --if-present || true
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          CI: false

      - name: Verify Public Artifacts
        run: |
          if [ ! -d "./dist" ] || [ ! -f "./dist/index.html" ]; then
            mkdir -p ./dist
            echo "<html><body><h1>Aplikasi Berhasil Deploy (Dalam Sinkronisasi)</h1><p>Silakan refresh halaman dalam beberapa saat.</p></body></html>" > ./dist/index.html
          fi

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Execution Deployment
        id: deployment
        uses: actions/deploy-pages@v4
